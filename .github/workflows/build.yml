name: OneClean bauen

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      - name: Signatur-Schlüssel einrichten
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/oneclean.jks"
          echo "ONECLEAN_KEYSTORE=$RUNNER_TEMP/oneclean.jks" >> "$GITHUB_ENV"
          echo "ONECLEAN_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ONECLEAN_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ONECLEAN_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$GITHUB_RUN_NUMBER" \
            -PupdateRepo="$GITHUB_REPOSITORY"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/OneClean-$VERSION.apk"
          cp tools/oneclean_multi.py dist/

      - uses: actions/upload-artifact@v4
        with:
          name: OneClean-${{ env.VERSION }}
          path: dist/

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OneClean ${{ env.VERSION }}
          files: |
            dist/OneClean-${{ env.VERSION }}.apk
            dist/oneclean_multi.py
          generate_release_notes: true
