name: OneClean bauen

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION (Code $GITHUB_RUN_NUMBER)"

      - name: Upload-Schlüssel einrichten
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/oneclean.jks"
          echo "ONECLEAN_KEYSTORE=$RUNNER_TEMP/oneclean.jks" >> "$GITHUB_ENV"
          echo "ONECLEAN_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ONECLEAN_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ONECLEAN_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: App Bundle (Play Store) und Test-APK bauen
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon --stacktrace \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          if [ -n "$ONECLEAN_KEYSTORE" ]; then SUFFIX=""; else SUFFIX="-unsigniert"; fi
          cp app/build/outputs/bundle/release/*.aab "dist/OneClean-$VERSION-$GITHUB_RUN_NUMBER$SUFFIX.aab"
          cp app/build/outputs/apk/debug/*.apk "dist/OneClean-$VERSION-test.apk"
          cp tools/oneclean_multi.py dist/

      - uses: actions/upload-artifact@v4
        with:
          name: OneClean-${{ env.VERSION }}-${{ github.run_number }}
          path: dist/

      # Legt das Ergebnis zusätzlich im Branch "build-output" ab (nur die jeweils letzte Version)
      - name: Build-Ergebnis in Branch build-output ablegen
        if: github.event_name == 'push'
        run: |
          cd dist
          git init -q -b build-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Build $VERSION ($GITHUB_RUN_NUMBER) von $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OneClean ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
